service: vocab-management-be
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-southeast-1
  stage: ${opt:stage, 'dev'}
  timeout: 25
  memorySize: 256
  httpApi:
    useProviderTags: true
    payload: '2.0'
    cors:
      allowedOrigins: ${ALLOWED_ORIGINS}
      allowedHeaders: [ '*' ]
      allowedMethods: [ 'GET', 'POST', 'PUT', 'DELETE' ]
      maxAge: 3000
  logs:
    httpApi: true
    frameworkLambda: false
  iam:
    role:
      name: serverless-vocab-management-be-role-${self:provider.stage}
      statements:
      - Effect: Allow
        Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
        Resource:
        - "arn:aws:logs:${self:provider.region}:*:log-group:/aws/lambda/${self:service}-${self:provider.stage}-*:*"
      - Effect: Allow
        Action:
        - s3:PutObject
        - s3:GetObject
        - s3:DeleteObject
        - s3:ListBucket
        Resource:
        - "arn:aws:s3:::${S3_BUCKET_NAME}"
        - "arn:aws:s3:::${S3_BUCKET_NAME}/*"

functions:
  api:
    handler: dist/lambda.handler
    environment:
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    events:
    - httpApi:
        path: /{proxy+}
        method: ANY
    - httpApi:
        path: /
        method: ANY

resources:
  Resources:
    VocabBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${S3_BUCKET_NAME}
        AccessControl: Private
        CorsConfiguration:
          CorsRules:
          - AllowedHeaders: [ '*' ]
            AllowedMethods: [ 'GET', 'POST', 'PUT', 'DELETE' ]
            AllowedOrigins: ${ALLOWED_ORIGINS}
            MaxAge: 3000
    LogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: "/aws/lambda/${self:service}-${self:provider.stage}-api"
        RetentionInDays: 7

plugins:
- serverless-esbuild
- serverless-dotenv-plugin
# Should be comment code before deploy on aws
# After aws deployed, uncomment code and deploy again to keep the latest file
# - serverless-s3-cleaner

custom:
  esbuild:
    bundle: true
    minify: true
    target: "es6"
    format: "esm"
    sourcemap: false
    exclude: [ "aws-sdk" ]
  dotenv:
    path: ./.env

  # Clean up old files in S3 bucket and keep the one latest file
  s3Cleaner:
    buckets:
    - ${S3_BUCKET_NAME}
    prefix: serverless/
    keepLatest: true
