service: vocab-management-be
frameworkVersion: '3'

useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-southeast-1
  stage: ${opt:stage, 'dev'}
  timeout: 25
  memorySize: 256
  httpApi:
    payload: '2.0'
    cors:
      allowedOrigins: ${self:custom.allowedOrigins}
      allowedHeaders: [ '*' ]
      allowedMethods: [ 'GET', 'POST', 'PUT', 'DELETE' ]
      maxAge: 3000
  logs:
    httpApi: true
    frameworkLambda: false
  iam:
    role:
      name: serverless-vocab-management-be-role-${self:provider.stage}
      statements:
      - Effect: Allow
        Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
        Resource:
        - "arn:aws:logs:${self:provider.region}:*:log-group:/aws/lambda/${self:service}-${self:provider.stage}-*:*"

functions:
  api:
    handler: dist/lambda.handler
    events:
    - httpApi:
        path: /{proxy+}
        method: ANY
    - httpApi:
        path: /
        method: ANY

resources:
  Resources:
    LogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: "/aws/lambda/${self:service}-${self:provider.stage}-api-${sls:instanceId}"
        RetentionInDays: 7

plugins:
- serverless-esbuild
- serverless-dotenv-plugin

custom:
  esbuild:
    bundle: true
    minify: true
    target: "es6"
    format: "esm"
    sourcemap: false
    exclude: [ "aws-sdk" ]
  allowedOrigins:
  - https://vocab-management.firebaseapp.com/
  - http://localhost:4030
  dotenv:
    path: ./.env
